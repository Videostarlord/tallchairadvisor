name: Nightly — God's-Eye

# God's-Eye Nightly (PRD raw/strategy/2026-08-05-godseye-PRD.md).
#
# This workflow OBSERVES the Mon–Sat pipeline; it does not replace it (PRD §4).
# Its contract with the rest of the system is unusual and load-bearing:
#
#   An unhealthy collector, a failing probe, or a regressed finding is a
#   SUCCESSFUL run. The observation system did its job. Only the harness
#   itself falling over is a failure.
#
# That is why almost every step is `continue-on-error: true` and the report
# step is `if: always()`. A nightly that aborts on the first bad collector
# would reproduce exactly the silent-failure class this build exists to kill.

on:
  schedule:
    # 00:00 UTC = 17:00 America/Los_Angeles during PDT — 5pm, when Jackson asked
    # for it (2026-08-13). Moved from 03:00 local: a report that lands while he
    # is asleep is read a day late or not at all.
    #
    # GitHub cron is UTC-only and does not observe DST, so this becomes 16:00
    # local during PST (Nov–Mar). Change to '0 1 * * *' to hold 17:00 through
    # the winter and give up 18:00 through the summer — one or the other, not
    # both. Do NOT "fix" it by adding a second cron entry: that double-runs for
    # half the year, and two reports a day is how a daily report stops being read.
    #
    # The dead-man's switch (a SECOND repo — scripts/deadmans-switch.README.md)
    # checks at 08:10 local against MAX_HEARTBEAT_AGE_HOURS=29. That still works
    # unchanged: a heartbeat written at 17:00 is ~15h old at the next check
    # (alive) and ~39h old if a run is missed (dead). The window it catches is
    # still exactly one missed cycle.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      skip_probes:
        description: 'Skip Playwright probes (faster dry run)'
        type: boolean
        default: false
      force_narrative:
        description: 'Generate the full written narrative even on a non-Sunday (costs ~$0.55)'
        type: boolean
        default: false
      # The ONLY supported way to re-baseline. It must happen on the runner that
      # does the comparison: the first baseline set was captured on a MacBook and
      # diffed on ubuntu, and the resulting font-rasterisation offset put all 49
      # mobile pages between 1.309% and 3.678% against a 2% threshold while
      # looking like five isolated page regressions. Re-baselining locally would
      # recreate that exact fault.
      rebaseline_visual:
        description: 'REPLACE every visual baseline with this run (nothing is compared)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  godseye:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RUN_DATE: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The reconciler and the ledger compare against history; a shallow
          # clone hides it. Also: file mtime is meaningless after checkout,
          # which is why readValidated() prefers embedded timestamps.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      # gsc-pull.ts and ga4-pull.ts both read the service account from THIS
      # FILE, not from an environment variable — ga4-pull.ts:27 hardcodes
      # credentials/gsc-service-account.json, and GA4 deliberately reuses the
      # GSC account rather than having one of its own. Passing the JSON as an
      # env var (as this workflow originally did) leaves the file absent, so
      # both collectors fail in CI while working perfectly on Jackson's
      # machine, where the file exists on disk. Mirrors monday.yml.
      - name: Restore GSC/GA4 service account credentials
        env:
          CREDS: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          echo "$CREDS" > credentials/gsc-service-account.json
          node -e "JSON.parse(require('fs').readFileSync('credentials/gsc-service-account.json','utf-8'))" \
            || { echo "::error::GSC_SERVICE_ACCOUNT_JSON is not valid JSON — GSC and GA4 will both fail"; exit 1; }

      # ── Browser-backed data acquisition, BEFORE the collectors ──────────
      # Chromium is for the RENDER PROBE only. It used to be shared with a
      # nightly Amazon Associates pull; that automation was RETIRED 2026-08-26
      # (see wiki/synthesis/decisions-log.md). Affiliate data is hand-dropped
      # into raw/affiliate/ and collectors/amazon.ts nags at 7 days.
      - name: Install chromium
        if: ${{ !inputs.skip_probes }}
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      # ── L1 collectors ───────────────────────────────────────────────────
      # Exits non-zero only if the harness crashed. Unhealthy collectors are
      # recorded as findings with reasons and the run continues (PRD §7.4).
      - name: Collect (GSC / GA4 / Clarity / Cloudflare / Actions / quotas / Amazon)
        id: collect
        continue-on-error: true
        run: npm run collect:all
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GA4 has no separate service account — ga4-pull.ts authenticates from
          # credentials/gsc-service-account.json, restored in the step above.
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Required, not optional: the token carries zone scopes but cannot
          # list accounts, so the account id has to be supplied explicitly.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # CANONICAL NAMES (A8). SERP_API_KEY and DATAFORSEO_USERNAME are the
          # names the secrets actually have in this repo, and therefore the
          # canonical spellings — see the table in .env.example. The vendors'
          # own names (SERPAPI_KEY, DATAFORSEO_LOGIN) are deprecated aliases
          # that only scripts/collectors/quotas.ts still resolves.
          #
          # Do not "correct" these to the vendor spellings. A wrong name here
          # does not fail: Actions substitutes an empty string, the collector
          # reports "no key set", and the quota check goes quietly blind. That
          # is exactly what happened on 2026-08-06.
          #
          # collect-all.ts now prints an ENV NAME DRIFT block if anything is
          # supplied under an alias, so a future rename cannot go unnoticed.
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DATAFORSEO_USERNAME: ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── L2 probes ───────────────────────────────────────────────────────
      # Chromium was installed above, with the affiliate pull.
      #
      # --visual (P1) captures desktop 1366x900 + mobile 375x812 and diffs each
      # against raw/visual/baseline/. The page is already open and already
      # measured, so this costs no extra navigation and no model tokens.
      #
      # Mobile had ZERO coverage before P1, on a site whose pages are full of wide
      # spec tables — the likeliest place to break and the place nothing looked.
      #
      # This run is against production and is not synthetic, so it MAY write a
      # baseline for a page that has none yet. That is how new pages enrol. It
      # cannot overwrite an existing baseline: only a deliberate re-baseline does.
      - name: Probe live site (tags fire, head truth, CWV, GEO, visual)
        id: probe
        if: ${{ !inputs.skip_probes }}
        continue-on-error: true
        run: npm run probe -- --visual --visual-artifacts visual-diffs ${{ inputs.rebaseline_visual && '--rebaseline' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Only written when a page exceeded the threshold, so an empty upload is the
      # normal case and means "nothing moved".
      - name: Upload visual diffs
        if: ${{ !inputs.skip_probes }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ github.run_id }}
          path: visual-diffs
          retention-days: 14
          if-no-files-found: ignore

      # ── L3 ledger ───────────────────────────────────────────────────────
      # Re-evaluates every open closure predicate against tonight's L1/L2
      # data: auto-closes with evidence, escalates after N failing nights,
      # and surfaces passed-then-failed as `regressed` (PRD §7.3).
      - name: Evaluate closure predicates
        id: ledger
        continue-on-error: true
        run: npm run ledger:evaluate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # ── Retention (A5) ──────────────────────────────────────────────────
      # MUST come after ledger:evaluate, and the reason is a correctness one.
      # scripts/lib/retention.ts pins any probe date cited as evidence by a
      # finding that is still open/escalated/regressed, and it reads those
      # statuses from data/ledger.jsonl. Run before the evaluation and tonight's
      # newly-opened finding has not been written yet, so its probe file looks
      # unpinned and becomes eligible for deletion the moment it ages out.
      #
      # Only data/probes/ is pruned. data/ledger.jsonl is append-only and is
      # never rewritten (ledger.ts invariant 3) — this step only SIZES it and
      # says so if it crosses the alarm threshold.
      #
      # The deletions reach the repo via the `git add data/probes` in the commit
      # step below: `git add <dir>` stages removals as well as additions, so the
      # pruned files leave main on the same night they leave the runner.
      - name: Prune probe artifacts (retention)
        continue-on-error: true
        run: npm run retention:prune

      # ── L4 cost ─────────────────────────────────────────────────────────
      - name: Roll up spend
        continue-on-error: true
        run: npm run cost:rollup

      # ── L5 report ───────────────────────────────────────────────────────
      # `always()` is deliberate. If collection and probing both failed, THAT
      # is the report — "what the system could not see tonight" is a required
      # section (PRD §7.6), and a missing report is what the dead-man's switch
      # alarms on. Never let an upstream failure suppress the nightly.
      # NARRATIVE IS WEEKLY (Sundays), EVERYTHING ELSE IS NIGHTLY.
      #
      # The LLM narrative was $13.34 of the pipeline's $16.16 August spend — 83%
      # — for a report that had been restating the same carry-over list nightly.
      # Its input was compounding too (71k tokens/run on 08-07, 168k on 08-28).
      #
      # This step still runs EVERY night and must. nightly-report.ts writes
      # data/nightly-heartbeat.json, which deadmans-switch.ts reads with a 29h
      # deadline: deleting or skipping the step would have alarmed Jackson's
      # phone every night — the dead-man's switch firing because the thing that
      # proves the pipeline alive stopped being called, not because anything
      # died. `--no-narrative` keeps the report, the footer, the ntfy push and
      # the heartbeat, and skips only the paid prose.
      # The session brief. Deterministic, no model call, $0 — it is a JOIN of data
      # the steps above already produced. Exists because the operating model is
      # "the pipeline observes, Jackson decides", which makes the session the
      # bottleneck — and most of every session was being spent re-gathering and
      # re-joining the same facts. Runs BEFORE the report so a failure here is
      # visible in the report rather than hidden behind it.
      - name: Write session brief
        if: always()
        continue-on-error: true
        run: npm run brief

      - name: Write nightly report
        id: report
        if: always()
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.force_narrative }}" = "true" ]; then
            echo "Sunday (or forced) — generating the full written narrative."
            npm run nightly
          else
            echo "Weekday — deterministic report only, no model call."
            npm run nightly -- --no-narrative
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Architecture lint (ratchet — new violations fail)
        if: always()
        continue-on-error: true
        run: npm run lint:architecture

      - name: Commit nightly artifacts
        if: always()
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          # [skip cd] — data-only commit, must not trigger a Cloudflare build.
          # data/nightly-heartbeat.json is REQUIRED here. The dead-man's switch
          # reads it from main via the GitHub API — a heartbeat that only ever
          # exists inside the runner is invisible to the watcher, goes stale at
          # 29h, and fires "TCA DEAD" on a night that ran perfectly.
          # raw/visual/baseline is included so a NEW page's first-sight baseline
          # survives the runner. Without it every night would rediscover that the
          # page has no baseline, write one into a container, throw it away, and
          # never once compare — a detector that runs forever and observes nothing.
          # data/agent-health.jsonl is REQUIRED here for the same reason the
          # heartbeat is (A13). It records every agent's stop_reason and every
          # input-floor assertion, and the nightly's detector-health check reads
          # it from the repo. A record that only ever exists inside the runner
          # cannot tell tomorrow's nightly that today's agent was truncated —
          # which is exactly how the audit sat at its max_tokens ceiling for
          # five weekly runs with every dashboard green.
          # data/gsc/inspection-rotation.json is the URL-inspection cursor, and
          # it is the ONE line that makes the rotation real. Without it every CI
          # run reads an absent cursor, collectors/gsc.ts falls back to a full
          # 49-URL sweep, and the rotation this repo just wired in never once
          # takes effect — see the header of scripts/lib/gsc-rotation.ts, which
          # named this exact missing line before it existed.
          for p in wiki/nightly reports/session-brief.md data/ledger.jsonl data/ledger-state.json \
                   data/cost-ledger.jsonl data/cost-summary.json data/cost-drift.jsonl \
                   data/agent-health.jsonl \
                   data/gsc/inspection-rotation.json \
                   raw/visual/baseline/provenance.json \
                   data/collectors data/probes data/interventions.jsonl \
                   data/edit-log.jsonl raw/visual/baseline \
                   data/affiliate \
                   data/nightly-heartbeat.json; do
            [ -e "$p" ] && git add "$p" || true
          done
          git diff --staged --quiet || git commit -m "[skip cd] nightly: god's-eye $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push || { sleep 15 && git push; } || { sleep 30 && git push; }

      # Surfaces the run's own state to the dead-man's switch and to Jackson
      # without requiring him to open anything.
      - name: Step summary
        if: always()
        run: |
          {
            echo "## God's-Eye $(date -u +%Y-%m-%d)"
            echo ""
            echo "| stage | outcome |"
            echo "|---|---|"
            echo "| collect | ${{ steps.collect.outcome }} |"
            echo "| probe | ${{ steps.probe.outcome }} |"
            echo "| ledger | ${{ steps.ledger.outcome }} |"
            echo "| report | ${{ steps.report.outcome }} |"
            echo ""
            if [ -f data/ledger-state.json ]; then
              echo '```json'
              cat data/ledger-state.json
              echo '```'
            else
              echo "_No ledger state written — the ledger step did not complete._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
