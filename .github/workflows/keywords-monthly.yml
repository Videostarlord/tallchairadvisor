name: Keywords — Monthly Discovery

on:
  schedule:
    - cron: '0 8 1 * *'  # 1st of each month, 08:00 UTC
  workflow_dispatch:
    inputs:
      sandbox:
        description: 'Use DataForSEO sandbox (true = free, false = production)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  keyword-discovery:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run keyword discovery (scheduled = production, dispatch = sandbox by default)
        run: npm run keyword:discovery
        env:
          DATAFORSEO_USERNAME: ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          # Scheduled runs use production API; workflow_dispatch defaults to sandbox.
          # Override: trigger workflow_dispatch with sandbox=false to test production manually.
          DATAFORSEO_SANDBOX: ${{ github.event_name == 'schedule' && 'false' || inputs.sandbox || 'true' }}

      - name: Run keyword gap discovery (competitor ranked keywords)
        run: npm run keyword:gaps
        env:
          DATAFORSEO_USERNAME: ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          DATAFORSEO_SANDBOX: ${{ github.event_name == 'schedule' && 'false' || inputs.sandbox || 'true' }}

      # ── Approval + roadmap push (added 2026-08-29) ──────────────────────
      #
      # THE CHAIN USED TO STOP HERE. keyword-discovery filled
      # opportunities.json every month, and nothing ever ran again: approval was
      # a human setting `approved: true` by hand, and keywords-push was wired
      # into NO workflow at all. The content pipeline ran for six months and
      # shipped zero pages — not broken, unowned.
      #
      # keywords-approve.ts is that human, as code. It rejects keywords the site
      # already ranks for (16 of the 18 candidates in the standing queue),
      # rejects near-duplicates of pages that already exist (the other 2), and
      # dedups near-identical variants within a batch.
      #
      # It approves nothing today, and that is the correct output — a month with
      # no qualifying gap is a real answer, recorded with a reason per candidate,
      # which is not the same as a month nobody looked at.
      - name: Approve qualifying keywords (no human in this loop)
        run: npm run keywords:approve

      - name: Push approved keywords into the content roadmap
        run: npm run keywords:push

      - name: Commit keyword data
        if: success()
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add data/keywords/ data/content-roadmap.json wiki/pages/concepts/ wiki/log.md wiki/index.md
          # data/cost-ledger.jsonl (A6): keyword-discovery.ts and
          # keyword-gap-discovery.ts both meterExternal their DataForSEO usage.
          # Committed only by nightly.yml until 2026-08-09, so the one workflow
          # that spends against a paid per-request vendor recorded that spend
          # into the runner and discarded it. See tuesday.yml for the full note.
          for f in data/cost-ledger.jsonl; do
            [ -e "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || git commit -m "[skip cd] data: monthly keyword discovery $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push && break
            echo "::warning::push attempt $attempt failed; rebasing and retrying"
            sleep $((attempt * 15))
          done
