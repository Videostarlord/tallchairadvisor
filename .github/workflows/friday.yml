name: Friday — New Content (Conditional)

# ─────────────────────────────────────────────────────────────────────────────
# SCHEDULE RETIRED 2026-08-29. Runs on workflow_dispatch only.
#
# WHY, from the record rather than from taste: in six months the autonomous
# acting agents changed src/ exactly SIX times (four sitemap/index fixes, two
# Thursday SEO runs in June). All 19 pages on the site were written in
# human-directed sessions, and every revenue-relevant change of August — the
# tracking-ID split, the CTA placement, the machine-retrieval scorer fix — came
# from a session too. Meanwhile the four automated position interventions failed
# across 37 days and 20 attempts.
#
# The operating model is now explicit: THE PIPELINE OBSERVES, JACKSON DECIDES.
# Collection, the 49-page probe, the ledger and its closure predicates,
# competitor intelligence, the Tuesday audit, keyword discovery and the
# dead-man's switch all still run nightly/weekly — they are the instrument that
# measures whether a session's change worked.
#
# THE REASON IS NOT COST. These three cost ~$0.26/month between them. It is that
# an idle acting-agent still files a stale-log finding every night, and an alarm
# that fires because nothing happened is indistinguishable from one that fires
# because something broke. That noise costs attention, which is the scarce
# resource here.
#
# DISABLED, NOT DELETED. The code is sound and the schedule is one line away.
# scripts/lib/retired-agents.ts is the single place that records which acting
# agents are off, and nightly-report.ts reads it so their logs stop being
# reported as failures. Re-enabling means restoring the cron here AND removing
# the entry there — the two must agree or the alarms come back.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # schedule:
  #   - cron: '0 8 * * 5 # 8:00 UTC = 1:00 AM PDT'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  execute-content:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Check upstream pipeline status
        run: |
          # Friday runs from staging — fetch pipeline-status.json from main where Monday writes it
          git fetch origin main --depth=1 2>/dev/null || true
          git show origin/main:data/pipeline-status.json > /tmp/pipeline-status.json 2>/dev/null || true
          if [ ! -s /tmp/pipeline-status.json ]; then
            echo "::warning::pipeline-status.json not found on main — Monday may not have run yet, proceeding"
            exit 0
          fi
          STATUS=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/pipeline-status.json','utf-8')).status")
          REASON=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/pipeline-status.json','utf-8')).reason")
          if [ "$STATUS" != "success" ]; then
            echo "::error::Skipped — upstream Monday failure: $REASON"
            exit 1
          fi
          echo "Upstream status: success — proceeding"

      - name: Run content agent
        id: content
        run: npx tsx scripts/agents/execute-content.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Warn if no content written
        if: env.CONTENT_WRITTEN != 'true'
        run: echo "::warning::CONTENT_WRITTEN=false — no pages published this week. Check reports/content-log.md for reason."

      - name: Verify build (only if content was written)
        if: env.CONTENT_WRITTEN == 'true'
        run: npm run build

      - name: Content lint
        if: env.CONTENT_WRITTEN == 'true'
        run: npm run lint:content

      - name: Commit new content
        if: env.CONTENT_WRITTEN == 'true'
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add src/
          git diff --staged --quiet || git commit -m "content: New pages $(date +%Y-%m-%d)"

      - name: Commit wiki + log updates
        if: env.CONTENT_WRITTEN == 'true'
        run: |
          git add reports/content-log.md raw/ wiki/
          # data/cost-ledger.jsonl: execute-content.ts makes THREE metered calls
          # per page (generate, answer-first score, competitive-depth score) and
          # is the most expensive agent in the week. Committed only by
          # nightly.yml until 2026-08-09, so its spend never once reached the
          # repo — see tuesday.yml. Pushes to `staging`; `merge=union` in
          # .gitattributes is what keeps Saturday's merge from conflicting.
          for f in data/audit-findings.json data/interventions.jsonl data/content-roadmap.json data/content-failed.json data/token-log.jsonl data/agent-health.jsonl data/cost-ledger.jsonl; do
            [ -e "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || git commit -m "[skip cd] data: Friday wiki + reports $(date +%Y-%m-%d)"
          git push origin HEAD:staging --force || { sleep 15 && git push origin HEAD:staging --force; } || { sleep 30 && git push origin HEAD:staging --force; }

      - name: Commit content log (failures)
        if: env.CONTENT_WRITTEN != 'true'
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add reports/content-log.md raw/ || true
          # data/cost-ledger.jsonl matters MORE on this path than on the success
          # one. No page was written, but the generate + score calls still ran
          # and were still billed. Dropping the ledger here is how a week of
          # paid-for failures reconciles to $0 and looks free.
          for f in data/audit-findings.json data/interventions.jsonl data/content-roadmap.json data/content-failed.json data/token-log.jsonl data/agent-health.jsonl data/cost-ledger.jsonl; do
            [ -e "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || git commit -m "[skip cd] data: No pages written $(date +%Y-%m-%d) — see content-log.md"
          git push origin HEAD:staging --force || { sleep 15 && git push origin HEAD:staging --force; } || true
