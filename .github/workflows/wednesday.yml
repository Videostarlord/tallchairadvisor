name: Wednesday — Strategy & Planning

on:
  schedule:
    - cron: '0 8 * * 3' # 8:00 UTC = 1:00 AM PDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  strategy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Check upstream pipeline status
        run: |
          if [ ! -f data/pipeline-status.json ]; then
            echo "::warning::pipeline-status.json not found — Monday may not have run yet, proceeding"
            exit 0
          fi
          STATUS=$(node -p "JSON.parse(require('fs').readFileSync('data/pipeline-status.json','utf-8')).status")
          REASON=$(node -p "JSON.parse(require('fs').readFileSync('data/pipeline-status.json','utf-8')).reason")
          if [ "$STATUS" != "success" ]; then
            echo "::error::Skipped — upstream Monday failure: $REASON"
            exit 1
          fi
          echo "Upstream status: success — proceeding"

      - name: Run strategy agent
        run: npx tsx scripts/agents/strategy.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit weekly plan + wiki updates
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add reports/weekly-plan.md raw/ wiki/
          # data/cost-ledger.jsonl: strategy.ts calls meteredCreate, which
          # appends this agent's spend inside the runner. Committed only by
          # nightly.yml until 2026-08-09, so every Wednesday's cost was
          # discarded with the container — see tuesday.yml for the full note.
          for f in data/audit-findings.json data/interventions.jsonl data/content-roadmap.json data/content-failed.json data/token-log.jsonl data/agent-health.jsonl data/cost-ledger.jsonl; do
            [ -e "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || git commit -m "[skip cd] plan: Week of $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push && break
            echo "::warning::push attempt $attempt failed; rebasing and retrying"
            sleep $((attempt * 15))
          done
