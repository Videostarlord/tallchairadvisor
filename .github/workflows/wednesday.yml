name: Wednesday — Strategy & Planning

on:
  schedule:
    - cron: '0 8 * * 3' # 8:00 UTC = 1:00 AM PDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Check upstream pipeline status
        run: |
          if [ ! -f data/pipeline-status.json ]; then
            echo "::warning::pipeline-status.json not found — Monday may not have run yet, proceeding"
            exit 0
          fi
          STATUS=$(node -p "JSON.parse(require('fs').readFileSync('data/pipeline-status.json','utf-8')).status")
          REASON=$(node -p "JSON.parse(require('fs').readFileSync('data/pipeline-status.json','utf-8')).reason")
          if [ "$STATUS" != "success" ]; then
            echo "::error::Skipped — upstream Monday failure: $REASON"
            exit 1
          fi
          echo "Upstream status: success — proceeding"

      - name: Run strategy agent
        run: npx tsx scripts/agents/strategy.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit weekly plan + wiki updates
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add reports/weekly-plan.md raw/ wiki/
          git diff --staged --quiet || git commit -m "[skip cd] plan: Week of $(date +%Y-%m-%d)"
          git push || { sleep 15 && git push; } || { sleep 30 && git push; }
