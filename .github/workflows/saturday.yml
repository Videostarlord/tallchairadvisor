name: Saturday — Verify & Deploy

on:
  schedule:
    - cron: '0 9 * * 6' # 9:00 UTC = 2:00 AM PDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Build site
        run: npm run build

      - name: Content lint
        run: npm run lint:content

      - name: Run verification agent
        run: npx tsx scripts/agents/verify-deploy.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit weekly summary + wiki updates and push
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add reports/weekly-summary.md raw/ wiki/
          git diff --staged --quiet || git commit -m "deploy: Weekly cycle $(date +%Y-%m-%d)"
          git pull --rebase origin staging
          git push origin staging
          git push origin HEAD:main
