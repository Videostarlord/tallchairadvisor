name: Saturday — Verify & Deploy

on:
  schedule:
    - cron: '0 9 * * 6' # 9:00 UTC = 2:00 AM PDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Merge main into staging (picks up Monday GSC pull + manual fixes)
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git fetch origin main
          # Append-only telemetry logs are resolved by the union merge driver
          # (.gitattributes). Anything that still conflicts is a real source
          # conflict and SHOULD stop the deploy — but it must say so, rather
          # than exiting 1 nine seconds in and leaving a bare red X.
          if ! git merge origin/main --no-edit -m "chore: sync main into staging before deploy"; then
            echo "::error title=staging merge conflict::Cannot sync main into staging. Deploy aborted before build."
            echo "Conflicted paths:"
            git diff --name-only --diff-filter=U | sed 's/^/  /'
            git merge --abort || true
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Build site
        run: npm run build

      - name: Content lint
        run: npm run lint:content

      - name: Run verification agent
        run: npx tsx scripts/agents/verify-deploy.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # P2. Here and not in the nightly: resubmitting is only meaningful after a
      # deploy has changed the sitemap, and the nightly changes no pages.
      #
      # continue-on-error because this is the LEAST consequential step in the
      # workflow — Google refetches the sitemap on its own schedule regardless,
      # and a submission hiccup must never fail a deploy that already built,
      # linted and verified. It submits and then reads back, so a green here
      # means Google recorded it with zero errors, not merely that a request was
      # accepted (submit returns 204 and proves nothing on its own).
      # Credential restored via env, matching monday.yml and nightly.yml — never
      # interpolated into the shell, where a key containing a quote would break
      # the line and could echo secret material into the log.
      - name: Submit sitemap to Search Console
        continue-on-error: true
        env:
          CREDS: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          echo "$CREDS" > credentials/gsc-service-account.json
          npx tsx scripts/gsc-sitemap.ts

      - name: Commit weekly summary + wiki updates and push
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add reports/weekly-summary.md raw/ wiki/
          git diff --staged --quiet || git commit -m "deploy: Weekly cycle $(date +%Y-%m-%d)"
          git push origin staging || { sleep 15 && git push origin staging; } || { sleep 30 && git push origin staging; }
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main && break
            echo "::warning::push attempt $attempt failed; rebasing and retrying"
            sleep $((attempt * 15))
          done
