name: Tuesday — Full Site Audit

on:
  schedule:
    - cron: '0 8 * * 2' # 8:00 UTC = 1:00 AM PDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Check upstream pipeline status
        run: |
          if [ ! -f data/pipeline-status.json ]; then
            echo "::warning::pipeline-status.json not found — Monday may not have run yet, proceeding"
            exit 0
          fi
          STATUS=$(node -p "JSON.parse(require('fs').readFileSync('data/pipeline-status.json','utf-8')).status")
          REASON=$(node -p "JSON.parse(require('fs').readFileSync('data/pipeline-status.json','utf-8')).reason")
          if [ "$STATUS" != "success" ]; then
            echo "::error::Skipped — upstream Monday failure: $REASON"
            exit 1
          fi
          echo "Upstream status: success — proceeding"

      - name: Run audit agent
        run: npx tsx scripts/agents/audit.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit audit report + wiki updates
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add reports/audit-report.md raw/ wiki/
          # data/audit-findings.json is the STRUCTURED source of truth that
          # Wednesday's strategy agent reads. Without it committed, Wednesday
          # falls back to auditReport.slice(0, 3000) — the exact truncation bug
          # the structured-findings work shipped to remove.
          #
          # data/agent-health.jsonl carries THIS AGENT's stop_reason and its
          # input-floor assertion (A13). The audit is the agent that ran at
          # max_tokens:4000 and hit the ceiling on five consecutive Tuesdays
          # while every dashboard stayed green; the record proving that is
          # written inside this runner and is worthless unless it survives it.
          # Uncommitted, the nightly can never see that Tuesday went blind.
          #
          # data/cost-ledger.jsonl is written by meteredCreate() on every LLM
          # call this agent makes. Until 2026-08-09 ONLY nightly.yml committed
          # it, so every weekday agent's spend was metered into the runner and
          # thrown away with it — `cost:rollup` reported 14 llm records, all of
          # them nightly-report's, and not one from audit/strategy/fixes/
          # content/verify. The meter worked; the seam lost the result.
          for f in data/audit-findings.json data/interventions.jsonl data/content-roadmap.json data/content-failed.json data/token-log.jsonl data/agent-health.jsonl data/cost-ledger.jsonl; do
            [ -e "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || git commit -m "[skip cd] report: Tuesday audit $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push && break
            echo "::warning::push attempt $attempt failed; rebasing and retrying"
            sleep $((attempt * 15))
          done
