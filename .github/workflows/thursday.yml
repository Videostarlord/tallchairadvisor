name: Thursday — Execute Fixes

on:
  schedule:
    - cron: '0 8 * * 4' # 8:00 UTC = 1:00 AM PDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  execute-fixes:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Check upstream pipeline status
        run: |
          if [ ! -f data/pipeline-status.json ]; then
            echo "::warning::pipeline-status.json not found — Monday may not have run yet, proceeding"
            exit 0
          fi
          STATUS=$(node -p "JSON.parse(require('fs').readFileSync('data/pipeline-status.json','utf-8')).status")
          REASON=$(node -p "JSON.parse(require('fs').readFileSync('data/pipeline-status.json','utf-8')).reason")
          if [ "$STATUS" != "success" ]; then
            echo "::error::Skipped — upstream Monday failure: $REASON"
            exit 1
          fi
          echo "Upstream status: success — proceeding"

      - name: Check weekly plan freshness (guard against stale/missing Wednesday plan)
        run: |
          if [ ! -f reports/weekly-plan.md ]; then
            echo "::error::reports/weekly-plan.md not found — Wednesday strategy agent may have failed. Skipping Thursday to avoid executing a stale plan."
            exit 1
          fi
          PLAN_DATE=$(grep -oP '\d{4}-\d{2}-\d{2}' reports/weekly-plan.md | head -1 || echo "")
          if [ -z "$PLAN_DATE" ]; then
            echo "::warning::Could not parse date from weekly-plan.md — proceeding anyway"
            exit 0
          fi
          NOW=$(date +%s)
          PLAN_TS=$(date -d "$PLAN_DATE" +%s 2>/dev/null || echo 0)
          DAYS_AGO=$(( (NOW - PLAN_TS) / 86400 ))
          echo "Plan date: $PLAN_DATE ($DAYS_AGO days ago)"
          if [ "$DAYS_AGO" -gt 7 ]; then
            echo "::error::weekly-plan.md is $DAYS_AGO days old — Wednesday likely failed this week. Skipping Thursday to avoid executing a stale plan."
            exit 1
          fi
          echo "Plan freshness OK — proceeding"

      - name: Run fixes agent
        run: npx tsx scripts/agents/execute-fixes.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verify build (with per-file rollback)
        run: |
          BUILD_OUT=$(npm run build 2>&1) && echo "$BUILD_OUT" && exit 0
          echo "$BUILD_OUT"
          # Extract the specific .astro file that caused the build failure
          FAILED_FILE=$(echo "$BUILD_OUT" | grep -oE 'src/pages/[^: ]+\.astro' | head -1)
          if [ -n "$FAILED_FILE" ] && [ -f "$FAILED_FILE" ]; then
            echo "Build failed in $FAILED_FILE — rolling back that file and retrying"
            git checkout HEAD -- "$FAILED_FILE" 2>/dev/null || true
            # Record rollback in fixes log
            echo "- [❌ ROLLED BACK] Build error in $FAILED_FILE — file restored to HEAD" >> reports/fixes-log.md
            npm run build
          else
            echo "Could not identify failing file — build error is not file-specific"
            exit 1
          fi

      - name: Content lint
        run: npm run lint:content

      - name: Commit code fixes
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add src/
          git diff --staged --quiet || git commit -m "fix: Thursday SEO fixes $(date +%Y-%m-%d)"

      - name: Commit data + wiki updates
        run: |
          git add reports/fixes-log.md raw/ wiki/
          git diff --staged --quiet || git commit -m "[skip cd] data: Thursday wiki + reports $(date +%Y-%m-%d)"
          git push origin HEAD:staging --force || { sleep 15 && git push origin HEAD:staging --force; } || { sleep 30 && git push origin HEAD:staging --force; }
