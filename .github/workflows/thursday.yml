name: Thursday — Execute Fixes

on:
  schedule:
    - cron: '0 8 * * 4' # 8:00 UTC = 1:00 AM PDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Run fixes agent
        run: npx tsx scripts/agents/execute-fixes.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verify build
        run: npm run build

      - name: Content lint
        run: npm run lint:content

      - name: Commit fixes + wiki updates
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add src/ reports/fixes-log.md raw/ wiki/
          git diff --staged --quiet || git commit -m "fix: Thursday SEO fixes $(date +%Y-%m-%d)"
          git pull --rebase origin staging
          git push origin HEAD:staging
