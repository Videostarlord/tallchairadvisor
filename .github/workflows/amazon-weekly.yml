
# P3. Replays a stored Associates session and archives the earnings CSVs.
#
# INERT UNTIL THE SECRET EXISTS. Without AMAZON_STORAGE_STATE the script exits 0
# with a setup notice and changes nothing, so this workflow is green and silent
# rather than a weekly red X nagging about a thing only Jackson can do.
# collectors/amazon.ts already nags at 7 days, which is the right place for it:
# one nag, tracked as a ledger finding with an age, not two.
#
# SETUP (Jackson, once, locally — never an agent, it is a live financial credential):
#   npx playwright codegen --save-storage=amazon-state.json https://affiliate-program.amazon.com/home/reports
#   gh secret set AMAZON_STORAGE_STATE < amazon-state.json
#   rm amazon-state.json
#
# WHY THIS RUNS BEFORE SATURDAY'S DEPLOY
# Sunday 08:00 UTC. The weekly agents read the affiliate archive; landing a fresh
# export before them means the week reasons about current revenue instead of
# last week's. It is also far enough from Saturday's deploy to avoid contending
# for the same branch.
#
# ON FAILURE IT WRITES NO NUMBER. An expired session files
# `amazon-session-expired` and NO report. A zero from a failed login is
# indistinguishable downstream from a genuinely zero month, and the kill-list
# gate that decides whether this site continues reads exactly that number.

name: Amazon — Weekly Associates Pull

on:
  schedule:
    - cron: '0 8 * * 0' # 08:00 UTC Sunday = 01:00 PDT
  workflow_dispatch:
    inputs:
      days:
        description: 'Window length in days (30 = the archive default)'
        required: false
        default: '30'
      dry_run:
        description: 'Verify the session and downloads without writing anything'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    # Job-level so the `if` on the chromium step can read it. A step's own `env:`
    # block is not in scope for that step's own `if`, which would silently make
    # the condition always false and skip the browser install every week.
    env:
      AMAZON_STORAGE_STATE: ${{ secrets.AMAZON_STORAGE_STATE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      # Only chromium, and only if the secret is present — no point installing a
      # browser for a run that will exit immediately.
      - name: Install chromium
        if: ${{ env.AMAZON_STORAGE_STATE != '' }}
        run: npx playwright install --with-deps chromium

      - name: Pull Associates export
        id: pull
        run: |
          npx tsx scripts/amazon-pull.ts \
            --mode weekly \
            --days "${{ github.event.inputs.days || '30' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # `if: always()` so an expired session still commits the marker that says so.
      # The evidence that the pull FAILED is as valuable as the data would have been —
      # it is what turns a silent gap into a tracked finding.
      - name: Commit export
        if: always()
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          for p in raw/affiliate data/affiliate data/collectors/amazon-session.json; do
            [ -e "$p" ] && git add "$p" || true
          done
          git diff --staged --quiet || git commit -m "[skip cd] data: Amazon Associates export $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push || { sleep 15 && git push; } || { sleep 30 && git push; }

      - name: Report outcome
        if: always()
        run: |
          if [ "${{ steps.pull.outcome }}" = "success" ]; then
            echo "### Amazon pull: ${{ steps.pull.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Amazon pull FAILED"
              echo ""
              echo "No revenue figure was recorded. This run measured nothing; it did not measure zero."
              echo "If the session expired, re-capture it:"
              echo '```'
              echo "npx playwright codegen --save-storage=amazon-state.json https://affiliate-program.amazon.com/home/reports"
              echo "gh secret set AMAZON_STORAGE_STATE < amazon-state.json && rm amazon-state.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
