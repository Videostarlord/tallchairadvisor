name: Monday — Data & Competitor Intelligence

on:
  schedule:
    - cron: '0 8 * * 1' # 8:00 UTC = 1:00 AM PDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  data-pull:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Restore GSC credentials
        env:
          CREDS: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          echo "$CREDS" > credentials/gsc-service-account.json

      - name: Pull GSC data
        run: npm run gsc:pull
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run GSC intelligence analysis
        run: npm run gsc:analyze
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Validate GSC data output
        run: |
          node -e "
            const fs = require('fs');
            const p = 'data/gsc/latest.json';
            if (!fs.existsSync(p)) { console.error('latest.json not found'); process.exit(1); }
            const data = JSON.parse(fs.readFileSync(p, 'utf-8'));
            if (!data.pages || data.pages.length === 0) {
              console.error('GSC pull returned empty pages array — marking pipeline as failed');
              process.exit(1);
            }
            console.log('Data validated: ' + data.pages.length + ' pages');
          "

      - name: Pull Clarity behavioral history
        run: npm run agent:clarity-history
        continue-on-error: true
        env:
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}

      - name: Pull GA4 analytics data
        run: npm run ga4:pull
        continue-on-error: true
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}

      - name: Run competitor intelligence
        run: npx tsx scripts/competitor-intelligence.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATAFORSEO_USERNAME: ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      # Answers the question the CTR thesis has never had evidence for: is there
      # an AI Overview on TCA's own money queries, and is TCA cited inside it?
      #
      # Lives HERE rather than in its own workflow for two reasons. Its input is
      # data/gsc/analysis.json, written four steps above — a separate schedule
      # would read whatever Monday last committed and silently analyse a stale
      # query set. And it calls the same DataForSEO SERP endpoint as
      # competitor-intelligence, so the credential, the quota and the failure mode
      # are already understood on this runner.
      #
      # continue-on-error: this is a NEW instrument. It must never be able to fail
      # the Monday pull that the rest of the week's agents depend on. A run that
      # cannot see writes `healthy: false` with a reason and says so; it does not
      # write a plausible zero.
      #
      # ~$0.04/run. AIO_SPEND_LIMIT (default $1) aborts before spending if the
      # query set ever grows unexpectedly.
      - name: Track AI Overview presence and citations
        run: npm run aio:track
        continue-on-error: true
        env:
          DATAFORSEO_USERNAME: ${{ secrets.DATAFORSEO_USERNAME }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}

      - name: Sync keyword gaps to content roadmap
        run: npm run roadmap:sync
        continue-on-error: true

      - name: Run indexing health check
        run: npx tsx scripts/agents/index-monitor.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Record pipeline success
        if: success()
        run: |
          node -e "require('fs').writeFileSync('data/pipeline-status.json', JSON.stringify({
            status: 'success',
            runId: '${{ github.run_id }}',
            reason: '',
            updatedAt: new Date().toISOString()
          }, null, 2))"

      - name: Record pipeline failure
        if: failure()
        run: |
          node -e "require('fs').writeFileSync('data/pipeline-status.json', JSON.stringify({
            status: 'failure',
            runId: '${{ github.run_id }}',
            reason: 'Monday data pull failed. Check Actions run ${{ github.run_id }}',
            updatedAt: new Date().toISOString()
          }, null, 2))"

      - name: Commit data files + wiki updates + any index fixes
        if: always()
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add data/pipeline-status.json data/gsc/latest.json data/gsc/analysis.json data/gsc/history/ data/competitors/ raw/ wiki/ src/
          # data/agent-health.jsonl (A13): every agent's stop_reason and
          # input-floor assertion. Append-only and written inside the runner, so
          # it must be committed or the nightly can never learn that a weekday
          # agent was truncated or ran on a fragment of its context.
          #
          # data/cost-ledger.jsonl (A6): competitor-intelligence.ts and
          # index-monitor.ts both call meteredCreate, and competitor-intelligence
          # also meterExternal's its SerpAPI credits. Committed only by
          # nightly.yml until 2026-08-09, so Monday's spend — the SerpAPI burn
          # included, which is the one with a 250/month free-tier cap — was
          # metered into the runner and thrown away. See tuesday.yml.
          #
          # data/aio/ and raw/aio/ are the AI Overview series. `raw/` is already
          # staged above, but data/aio/latest.json is not covered by any existing
          # pattern — and an un-committed archive makes this instrument worthless
          # rather than merely incomplete: `computeDeltas` reads the PREVIOUS run
          # off disk, so a series that never leaves the runner has no previous run
          # and reports "no changes" forever while looking like it is working.
          for f in "data/clarity/" "data/ga4/" "data/content-roadmap.json" "data/content-failed.json" "reports/index-monitor.md" "data/agent-health.jsonl" "data/cost-ledger.jsonl" "data/aio/"; do
            [ -e "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || git commit -m "[skip cd] data: Monday pull + index fixes $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push && break
            echo "::warning::push attempt $attempt failed; rebasing and retrying"
            sleep $((attempt * 15))
          done
