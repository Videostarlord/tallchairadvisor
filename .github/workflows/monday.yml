name: Monday — Data & Competitor Intelligence

on:
  schedule:
    - cron: '0 8 * * 1' # 8:00 UTC = 1:00 AM PDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data-pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Restore GSC credentials
        env:
          CREDS: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          echo "$CREDS" > credentials/gsc-service-account.json
          echo "Secret length: ${#CREDS}"
          echo "First 15 chars: ${CREDS:0:15}"
          echo "Last 5 chars: ${CREDS: -5}"
          python3 -c "import json; json.load(open('credentials/gsc-service-account.json'))" \
            && echo "✅ JSON is valid" \
            || { echo "❌ Not valid JSON — secret may be base64-encoded or truncated"; exit 1; }

      - name: Pull GSC data
        run: npm run gsc:pull
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run competitor intelligence
        run: npx tsx scripts/agents/competitor-monitor.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit data files + wiki updates
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add data/gsc/latest.json data/competitors/latest.json raw/ wiki/
          git diff --staged --quiet || git commit -m "data: Monday pull $(date +%Y-%m-%d)"
          git push
