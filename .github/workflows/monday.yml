name: Monday — Data & Competitor Intelligence

on:
  schedule:
    - cron: '0 8 * * 1' # 8:00 UTC = 1:00 AM PDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data-pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Restore GSC credentials
        env:
          CREDS: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          echo "$CREDS" > credentials/gsc-service-account.json

      - name: Pull GSC data
        run: npm run gsc:pull
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run GSC intelligence analysis
        run: npm run gsc:analyze
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run competitor intelligence
        run: npx tsx scripts/competitor-intelligence.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Run indexing health check
        run: npx tsx scripts/agents/index-monitor.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit data files + wiki updates + any index fixes
        run: |
          git config user.name "tca-bot"
          git config user.email "bot@tallchairadvisor.com"
          git add data/gsc/latest.json data/gsc/analysis.json data/gsc/history/ data/competitors/ reports/index-monitor.md raw/ wiki/ src/
          git diff --staged --quiet || git commit -m "data: Monday pull + index fixes $(date +%Y-%m-%d)"
          git push
